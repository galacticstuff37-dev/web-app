<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
 html,body{margin:0;background:#0d1512;color:#dfe8e2;font:11px/1.32 ui-monospace,Menlo,monospace}
 #log{padding:6px 8px;white-space:pre-wrap}
 .ok{color:#8ee06a} .no{color:#ff7a7a} .h{color:#8fc7ff}
 iframe{position:fixed;right:0;bottom:0;width:402px;height:714px;border:0;opacity:.02;pointer-events:none}
</style>
<div id=verdict style="position:fixed;left:0;right:0;top:0;z-index:9;padding:6px 8px;background:#0d1512;border-bottom:1px solid #24352c;font-weight:700"></div>
<div id=log style="padding-top:30px">гоняю…</div>
<iframe id=f></iframe>
<script>
// СТЕНА И ЛЬГОТА ОФЛАЙНА. Своя страница, а не раздел в authcheck, и это не
// вкусовщина: написанные там, эти проверки роняли вкладку Safari целиком и
// уносили с собой все 70+ проверок соседа. Причина — гонка редиректов: стена
// уводила с home на signin, а охранник «вошедшему не показываем вход» возвращал
// обратно, сотни переходов в секунду. Гонку починили (охранник требует ЖИВОЙ
// сессии), но цена ошибки здесь такая, что стенду место отдельно.
//
// Отсутствие сети имитируем СОБЫТИЕМ 'offline' в окне iframe. Подмена
// navigator.onLine роняла вкладку, а приложение (useOnline в App.tsx) читает
// navigator ровно один раз при монтировании и дальше слушает события — значит
// события достаточно.
const APP = new URLSearchParams(location.search).get('app') || '/web-app/react/index.html';
const F = document.getElementById('f'), LOG = document.getElementById('log');
let out = [], fails = 0, failMsgs = [], sections = [], cur = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const W = () => F.contentWindow, D = () => F.contentDocument;
const S = () => W().__state();
const hash = () => W().location.hash.slice(1);
function say(ok, msg) {
  if (!ok) { fails++; failMsgs.push(msg) }
  if (cur) { ok ? cur.ok++ : cur.no++ }
  out.push(`<span class="${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'}</span> ${msg}`);
  LOG.innerHTML = out.join('<br>');
}
function head(t) {
  cur = {name: t, ok: 0, no: 0}; sections.push(cur);
  out.push(`<span class="h">── ${t}</span>`); LOG.innerHTML = out.join('<br>');
}
async function waitFor(ok, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 5000)) { if (ok()) return true; await sleep(120) }
  return ok();
}

const SESSION_KEY = 'sb-bslttprzsbigcfplpxff-auth-token';
const UID = '77777777-7777-4777-8777-777777777777';
/** Синтетическая сессия: настоящую без Google не достать (анонимный вход в
    проекте выключен). Токен не подписан ключом проекта — база отвечает 401, и
    это ровно то, что нужно: стенд мерит поведение приложения, а не базу.
    secondsLeft < 0 — токен уже истёк: библиотека пойдёт его обновлять, получит
    отказ и снесёт сессию. Так выглядит обычный час жизни настоящей сессии. */
function putSession(secondsLeft) {
  const now = Math.floor(Date.now() / 1000), exp = now + secondsLeft;
  const b64 = o => btoa(JSON.stringify(o)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const iso = s => new Date(s * 1000).toISOString();
  localStorage.setItem(SESSION_KEY, JSON.stringify({
    access_token: [b64({alg:'HS256',typ:'JWT'}),
                   b64({sub:UID, aud:'authenticated', role:'authenticated', exp,
                        email:'sam@example.com'}), 'sig'].join('.'),
    token_type: 'bearer', expires_in: secondsLeft, expires_at: exp,
    refresh_token: 'synthetic-refresh',
    user: {id: UID, aud: 'authenticated', role: 'authenticated', email: 'sam@example.com',
           email_confirmed_at: iso(now - 600), created_at: iso(now - 600), updated_at: iso(now),
           app_metadata: {provider: 'google', providers: ['google']},
           user_metadata: {}, identities: []},
  }));
}
/**
 * Сессия — состояние ORIGIN, а не страницы: она переживает переход между
 * стендами в одном Safari. Поэтому сессию здесь кладёт и снимает КАЖДЫЙ раздел
 * явно, третьим аргументом seed(), и никогда — по умолчанию.
 */
const ACC = {email: 'sam@example.com', via: 'google', uid: UID};
const PLANTS = [{id: 'basil', since: 1, day: 20, photos: []}];
function seed(st, hash, session) {
  const base = {v:1, plants: PLANTS, choices:{}, selected:0, isPro:false, units:'imperial',
    remind:3, care:{pick:true,leaf:true,rotate:true,feed:true},
    mail:{weekly:true,water:true,news:false}, done:{}, calView:'month',
    onbMode:null, account:null};
  localStorage.setItem('hg.state', JSON.stringify(Object.assign(base, st)));
  if (session === undefined) localStorage.removeItem(SESSION_KEY); else putSession(session);
  // Следы предыдущего раздела: причина прошлого провала и метка нарочного выхода
  // живут в localStorage и переживают перезагрузку iframe.
  localStorage.removeItem('hg.authErr');
  localStorage.removeItem('hg.signOutAt');
  try { sessionStorage.setItem('hg.greeted', '1') } catch (e) {}
  return load(hash);
}
function load(h) {
  return new Promise(res => { F.onload = () => setTimeout(res, 430); F.src = APP + '?t=' + Date.now() + '#' + h });
}
/** Сеть пропала / вернулась. Именно событие: см. шапку файла. */
const net = up => W().dispatchEvent(new (W().Event)(up ? 'online' : 'offline'));
/** Уйти на экран изнутри приложения и дать стене шанс сработать. */
async function goto(h) { W().location.hash = h; await sleep(500) }
const offlineFlag = () => D().body.classList.contains('is-offline');

(async () => {
  // ── 1. Аноним: приложения нет, онбординг есть
  head('аноним — приложение закрыто');
  for (const id of ['home', 'settings', 'calendar', 'account']) {
    await seed({}, id);
    await waitFor(() => hash() === 'signin', 4000);
    say(hash() === 'signin', id + ' → signin (' + hash() + ')');
  }
  say(!S().account, 'аккаунт при этом не заводится сам собой');

  head('аноним — онбординг открыт');
  for (const id of ['landing', 'q0', 'preview', 'save']) {
    await seed({}, id);
    await sleep(400);
    say(hash() === id, id + ' открыт без аккаунта (' + hash() + ')');
  }
  // Библиотека и сканер лежат в группе Home, но обе ветки онбординга ходят через
  // них: «уже есть растения» с q0 и «I'll pick my own» с preview. Без поправки
  // на onbMode стена рубила онбординг на первом же шаге.
  for (const id of ['add-plant', 'scan']) {
    await seed({onbMode: 'have'}, id);
    await sleep(400);
    say(hash() === id, id + ' открыт посреди онбординга (' + hash() + ')');
  }
  await seed({}, 'add-plant');
  await waitFor(() => hash() === 'signin', 4000);
  say(hash() === 'signin', 'но ВНЕ онбординга библиотека закрыта (' + hash() + ')');

  // ── 2. Живая сессия открывает приложение
  head('живая сессия — приложение открыто');
  await seed({account: ACC}, 'home', 86400);
  await sleep(700);
  say(hash() === 'home', 'home остаётся home (' + hash() + ')');
  say(S().session === 'live', 'сессия опознана живой: ' + S().session);
  say(!!D().querySelector('.nav'), 'таб-бар на месте — это приложение, а не вход');
  say(!offlineFlag(), 'класса is-offline нет: сеть есть');
  await goto('settings');
  say(hash() === 'settings', 'настройки открываются (' + hash() + ')');

  // ── 3. Мёртвый токен при живой сети — стена
  head('мёртвый токен — стена');
  await seed({account: ACC}, 'home', -60);
  // Библиотека просит новый токен, получает отказ и сносит сессию; стена уводит.
  await waitFor(() => S().session === 'none' && hash() === 'signin', 9000);
  say(S().session === 'none', 'умершая сессия гасит доступ: ' + S().session);
  say(hash() === 'signin', 'стена уводит на вход (' + hash() + ')');
  say(!!S().account, 'но аккаунт помнится: забыть его может только Sign out');
  await sleep(600);                       // пусть умирающий документ дорассылает своё

  // ── 4. Льгота офлайна
  head('офлайн — приложение работает');
  await seed({account: ACC}, 'home');
  await waitFor(() => hash() === 'signin', 4000);
  say(hash() === 'signin', 'без сети ещё не объявлено — человек у стены (' + hash() + ')');
  net(false);
  await sleep(300);
  say(offlineFlag(), 'сеть пропала → на body класс is-offline');
  await goto('home');
  say(hash() === 'home', 'home открывается по льготе (' + hash() + ')');
  say(!!D().querySelector('.nav'), 'таб-бар на месте');
  say(S().session !== 'live', 'и это НЕ живая сессия: ' + S().session);
  await goto('settings');
  say(hash() === 'settings', 'настройки тоже открыты (' + hash() + ')');

  // ── 5. Сеть вернулась, токена по-прежнему нет — снова стена
  head('сеть вернулась — снова стена');
  await goto('home');
  say(hash() === 'home', 'стоим на home по льготе (' + hash() + ')');
  net(true);
  await waitFor(() => hash() === 'signin', 4000);
  say(hash() === 'signin', 'льгота кончилась вместе с офлайном (' + hash() + ')');
  say(!offlineFlag(), 'класс is-offline снят');
  say(!!S().account, 'аккаунт всё ещё помнится');

  // ── 6. Демо-аккаунт льготы не даёт
  head('демо-вход льготы не даёт');
  await seed({account: Object.assign({}, ACC, {demo: true, via: 'email'})}, 'home');
  await waitFor(() => hash() === 'signin', 4000);
  net(false);
  await sleep(300);
  say(!offlineFlag(), 'класса is-offline нет: за демо-входом сессии не стояло');
  await goto('home');
  say(hash() === 'signin', 'офлайн демо-аккаунта в приложение не пускает (' + hash() + ')');

  // Уборка: сессия и следы — состояние origin, а соседние стенды идут следом в
  // том же Safari и мерили бы вошедшего там, где проверяют анонима.
  net(true);
  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem('hg.authErr');
  localStorage.removeItem('hg.signOutAt');

  // Итог наверх: снизу его закрывает панель Safari, а проскроллить симулятор
  // без тапа нельзя.
  const total = sections.reduce((n, x) => n + x.ok + x.no, 0);
  document.getElementById('verdict').innerHTML = fails
    ? `<span class="no">ПРОВАЛОВ: ${fails} из ${total}</span>`
    : `<span class="ok">ВСЁ ПРОЙДЕНО · ${total} проверок</span>`;
  const sum = sections.map(x => `<span class="${x.no ? 'no' : 'ok'}">${x.no ? '✗' : '✓'}</span>`
    + ` ${x.name} — ${x.ok}/${x.ok + x.no}`).join('<br>');
  const why = failMsgs.length
    ? `<span class="h">── что именно провалилось</span><br>`
      + failMsgs.map(m => `<span class="no">✗</span> ${m}`).join('<br>') + '<br><br>'
    : '';
  LOG.innerHTML = `<span class="h">── итог по разделам</span><br>${sum}<br><br>${why}`
    + out.join('<br>');
  scrollTo(0, 0);
})().catch(e => {
  document.getElementById('verdict').innerHTML =
    '<span class="no">СБОЙ СТЕНДА: ' + e.message + '</span>';
  LOG.innerHTML += '<br><span class="no">СБОЙ: ' + e.message + '</span>';
});
</script>
