<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
 html,body{margin:0;background:#0d1512;color:#dfe8e2;font:11px/1.34 ui-monospace,Menlo,monospace}
 #log{padding:6px 8px;white-space:pre-wrap}
 .ok{color:#8ee06a} .no{color:#ff7a7a} .h{color:#8fc7ff}
 #f{position:fixed;right:0;bottom:0;border:0;opacity:.02;pointer-events:none}
</style>
<div id=log>свип…</div>
<iframe id=f></iframe>
<script>
// Что проверять. По умолчанию /web-app/react/ — собранный бандл ссылается на
// ассеты по этому абсолютному пути, поэтому репозиторий обязан отдаваться как
// /web-app (см. README рядом). ?app=<url> — любая другая сборка того же origin.
const APP = new URLSearchParams(location.search).get('app') || '/web-app/react/index.html';
const F = document.getElementById('f'), LOG = document.getElementById('log');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const D = () => F.contentDocument, W = () => F.contentWindow;

const ROUTES = ['landing','q0','qwhat','q1','q2','q3','q2i','q4','q5','preview','save','signin','email','code',
  'home','add-plant','week-lock','week-empty','week-back','week-long','season-end',
  'scan','plant','harvest','shopping','calendar','crop','paywall','week-done',
  'settings','account','pick','indoor'];
const SIZES = [[320,568],[360,640],[375,667],[390,844],[414,896],[430,932]];
const P = (id, since, day, ph) => ({id, since, day, photos: ph || []});
const UID = '11111111-1111-4111-8111-111111111111';
const P1 = 'aaaaaaaa-1111-4111-8111-111111111111';
const P2 = 'bbbbbbbb-2222-4111-8111-222222222222';
const F1 = 'ffffffff-1111-4111-8111-111111111111';
const CAM = 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
/** Синтетическая сессия: настоящую без Google не получить, а без сессии экраны
    приложения закрыты стеной. Токен не подписан ключом проекта — база отвечает
    401, и это ровно то, что нужно: свип мерит вёрстку, а не данные. */
const SESSION_KEY = 'sb-bslttprzsbigcfplpxff-auth-token';
function putSession() {
  const now = Math.floor(Date.now() / 1000), exp = now + 86400;
  const b64 = o => btoa(JSON.stringify(o)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const uid = '77777777-7777-4777-8777-777777777777';
  const iso = s => new Date(s * 1000).toISOString();
  localStorage.setItem(SESSION_KEY, JSON.stringify({
    access_token: [b64({alg:'HS256',typ:'JWT'}),
                   b64({sub:uid, aud:'authenticated', role:'authenticated', exp,
                        email:'sam@example.com'}), 'sig'].join('.'),
    token_type: 'bearer', expires_in: 86400, expires_at: exp,
    refresh_token: 'synthetic-refresh',
    user: {id: uid, aud: 'authenticated', role: 'authenticated', email: 'sam@example.com',
           email_confirmed_at: iso(now - 600), created_at: iso(now - 600), updated_at: iso(now),
           app_metadata: {provider: 'google', providers: ['google']},
           user_metadata: {}, identities: []},
  }));
}
const base = st => Object.assign({v:1, plants:[], choices:{}, selected:0, isPro:false,
  units:'imperial', remind:3, care:{pick:true,leaf:true,rotate:true,feed:true},
  mail:{weekly:true,water:true,news:false}, done:{}, calView:'month', onbMode:null}, st);
const STATES = {
  'овощи': base({plants:[P('radish',0,27,[{f:'radish',day:24}]),P('lettuce',1,24,[{f:'leaves3',day:18}]),
                        P('basil',3,34,[{f:'basil',day:21}]),P('cherrytomato',1,12)]}),
  'комнатные': base({plants:[P('monstera',4,210,[{f:'leaves3',day:18}]),P('snakeplant',20,430),
                             P('pothos',9,96),P('peacelily',2,64,[{f:'flowers',day:21}])],
                     choices:{track:'house',space:'windowsill',outdoor:false,sun:'bright indirect light',sunRank:2,goals:[],effort:4,zip:'78704'}}),
  'смешанные': base({plants:[P('monstera',4,210),P('pothos',9,96),P('basil',1,34),P('radish',0,27)],
                     choices:{track:'both',space:'patio',outdoor:true,sun:'6–8 hours of sun',sunRank:2,goals:[],effort:4,zip:'10025'}}),
  'пусто': base({}),
  'pro': base({plants:[P('monstera',4,210),P('pothos',9,96),P('basil',1,34),P('radish',0,27)], isPro:true, units:'metric'}),
  // Вошедший человек: без него экран аккаунта уводит в настройки, и свип мерил
  // бы настройки под чужим именем. Кадр с камеры нужен, чтобы на экране была и
  // третья строка «только на этом телефоне», и пояснение под списком — самый
  // длинный вариант содержимого.
  'вошёл': base({plants:[Object.assign(P('kale',9,11,[{id:F1,f:'leaves1',day:7},
                                                      {id:'cam-1',u:CAM,day:10}]), {rid:P1}),
                         Object.assign(P('pepper',0,31), {rid:P2})],
                 account:{email:'yakov.designe@vortexgames.com', via:'google', uid:UID}}),
};

/** Снимок последней отправки для состояния «вошёл»: без него экран честно скажет
    «ещё ничего не уехало», а нам нужен вариант с цифрами. */
const SNAP = {v:1, uid:UID, at:new Date(Date.now() - 7*60000).toISOString(),
  rows:{['p:'+P1]:'kale|9|11', ['s:'+P1]:'0', ['p:'+P2]:'pepper|0|31', ['s:'+P2]:'1',
        ['f:'+F1]:P1+'|leaves1|7', 'u:':'stub'}};

function reload(hash) {
  return new Promise(res => { F.onload = () => setTimeout(res, 480); F.src = APP + '?t=' + Date.now() + '#' + hash; });
}
/**
 * Выход за границы вьюпорта: пропускаем то, что режет родитель с overflow.
 *
 * ИСКЛЮЧЕНИЕ — .cf-box. Лист (аккаунт) прокручивается ПО ВЕРТИКАЛИ, и ради
 * этого у него overflow-y: auto. Браузер при этом считает и overflow-x равным
 * auto — так требует спецификация, если хотя бы одна ось не visible. Из-за этого
 * всё содержимое листа выпадало из осмотра: свип видел лист как горизонтальную
 * карусель, которой он не является. Правило про overflow здесь ради карусели
 * растений (.prow-scroll), а не ради листа, поэтому лист клипером не считаем и
 * идём выше по дереву. Отдельно ниже проверяется, что сам лист не поехал
 * горизонтально.
 */
function measure() {
  const d = D(), w = W().innerWidth, bad = [];
  const clipped = e => { for (let p = e.parentElement; p; p = p.parentElement) {
    if (p.classList && p.classList.contains('cf-box')) continue;
    const ox = W().getComputedStyle(p).overflowX;
    if (ox === 'auto' || ox === 'scroll' || ox === 'hidden') return true; } return false; };
  d.querySelectorAll('.mob *').forEach(e => {
    const r = e.getBoundingClientRect();
    if (!r.width && !r.height) return;
    if ((r.right > w + 0.5 || r.left < -0.5) && !clipped(e))
      bad.push((e.className || e.tagName) + '[' + Math.round(r.left) + '..' + Math.round(r.right) + ']');
  });
  // Горизонтальная прокрутка ВНУТРИ листа — такой же дефект, как выход за экран:
  // лист обязан прокручиваться только вверх-вниз.
  d.querySelectorAll('.cf-box').forEach(x => {
    if (x.scrollWidth > x.clientWidth + 0.5)
      bad.push('cf-box[поехал горизонтально: ' + x.scrollWidth + '>' + x.clientWidth + ']');
  });
  const de = d.documentElement;
  return {page: de.scrollWidth > de.clientWidth + 0.5,
          empty: !d.querySelector('.mob') || !d.querySelector('.mob').children.length,
          n: bad.length, first: bad.slice(0, 2).join(' ')};
}

const TOTAL = ROUTES.length * Object.keys(STATES).length * SIZES.length;

(async () => {
  let renders = 0; const viol = [], errs = [];
  for (const [w, h] of SIZES) {
    F.style.width = w + 'px'; F.style.height = h + 'px';
    for (const [sname, st] of Object.entries(STATES)) {
      localStorage.setItem('hg.state', JSON.stringify(st));
      // Сессия обязательна: приложение закрыто без входа, и без неё свип
      // рендерил бы экран входа вместо 33 экранов — покрытие молча упало бы до
      // одного экрана, а «0 выходов за экран» стало бы бессмысленным.
      putSession();
      if (st.account) localStorage.setItem('hg.sync', JSON.stringify(SNAP));
      else localStorage.removeItem('hg.sync');
      // Причина прошлого провала входа живёт отдельным ключом и показывается
      // нотой на #signin. Вешаем её на состояние «пусто», иначе самый длинный
      // вариант этого экрана не мерился бы ни на одной ширине.
      if (sname === 'пусто') {
        localStorage.setItem('hg.authErr', JSON.stringify({at: Date.now(),
          why: 'the link came back to a different address than it started from'}));
      } else localStorage.removeItem('hg.authErr');
      // Приветственный лист накрыл бы каждый экран этого состояния и дал бы
      // ложные выходы за экран. Его дело проверяет authcheck.
      try { sessionStorage.setItem('hg.greeted', '1') } catch (e) {}
      await reload('home');
      W().addEventListener('error', ev => errs.push(sname + ' ' + ev.message));
      const ce = W().console.error;
      W().console.error = (...a) => { errs.push(sname + ' ' + a.join(' ').slice(0, 90)); ce(...a); };
      for (const r of ROUTES) {
        W().location.hash = r;
        await sleep(70);
        const m = measure(); renders++;
        if (m.page || m.n || m.empty)
          viol.push(`${w}x${h} ${sname} #${r}: page=${m.page} empty=${m.empty} n=${m.n} ${m.first}`);
      }
      LOG.innerHTML = `<span class=h>рендеров ${renders}/${TOTAL} · выходов ${viol.length} · ошибок ${errs.length}</span>`;
    }
  }
  LOG.innerHTML = `<span class=h>── свип: ${ROUTES.length} экрана × ${Object.keys(STATES).length} состояний × ${SIZES.length} ширин</span><br>`
    + `рендеров: ${renders}<br>`
    + `<span class="${viol.length ? 'no' : 'ok'}">выходов за экран: ${viol.length}</span><br>`
    + viol.slice(0, 12).map(v => '  ' + v).join('<br>')
    + `<br><span class="${errs.length ? 'no' : 'ok'}">ошибок консоли: ${errs.length}</span><br>`
    + errs.slice(0, 8).map(v => '  ' + v).join('<br>');
})().catch(e => { LOG.innerHTML += '<br><span class=no>СБОЙ: ' + e.message + '</span>'; });
</script>
